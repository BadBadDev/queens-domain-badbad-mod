name: Lua checks

on: pull_request

permissions:
  contents: read

concurrency:
  group: lua-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lua quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Lua 5.4 and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 lua-check

      - name: Compile-check every Lua file
        run: find Scripts tests -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.4 -p

      - name: Reject lint warnings and errors
        run: luacheck --codes Scripts tests

      - name: Check formatting
        run: npm exec --yes --package=@johnnymorganz/stylua-bin@2.6.0 -- stylua --check Scripts tests

      - name: Run automated Lua tests
        run: lua5.4 tests/bbm.lua
