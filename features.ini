; Switches: 1 = on, 0 = off.
graphics=1
; Pickup shimmer: 0 = Off, 1 = Low, 2 = Mid (default), 3 = High, 4 = Over Here! Changes apply immediately.
shimmer=2
; Enemy HP bars: 0 = off, 1 = HP bar, 2 = HP bar + damage.
enemyHpBars=2
drag=1
itemStats=1
inventoryStats=1
statusNames=1
travelStride=0
quickSave=1

; Advanced settings (read at startup)
; Internal render scale: 50-200 percent. 100 is native; 125 or 150 supersamples at higher GPU cost.
screenPercentage=100
; Seconds to display the last hit damage on enemy and boss bars.
damageSeconds=0.85
; Seconds out of combat before Travel Stride activates. 0 means no wait; fractions are allowed.
travelStrideDelaySeconds=12
; Extra ground speed in percent while Travel Stride is active. 25 = 1.25x normal; 0 = no bonus.
travelStrideSpeedBonusPercent=25
; Extra sword-dash recharge rate in percent. 100 = twice as fast; 0 = normal recharge.
travelStrideSwordRechargeBonusPercent=100
